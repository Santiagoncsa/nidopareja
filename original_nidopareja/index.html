              ),
              p.desc ? h("p", { class: "plan-card-desc" }, p.desc) : null,
              h("div", { style: { fontSize: "0.72rem", color: "var(--ink-muted)", marginTop: "0.3rem", display: "flex", alignItems: "center", gap: "0.3rem" } },
                "Agregado por ", h("strong", {}, p.createdBy || "Nido")
              )
            ),
            h("div", { class: "plan-actions" },
              h("button", {
                class: "subtab-btn",
                style: { padding: "0.3rem 0.6rem", fontSize: "0.75rem", background: "var(--surface-muted)" },
                onClick: () => {
                  // Cargar en la ruleta e ir directo a la pestaña de ruleta
                  const cur = state.rouletteOptions || [];
                  if (!cur.includes(p.title)) {
                    if (cur.length >= 6) cur.shift(); // Quita una vieja si llegó al límite
                    state.rouletteOptions = [...cur, p.title];
                  }
                  state.citasSubTab = "indeciso";
                  state.rouletteWinner = null;
                  render();
                },
                title: "Pasar esta idea a la ruleta"
              }, DicesIcon(13), " A la ruleta"),
              h("button", {
                class: "icon-btn",
                onClick: () => { state.editingPlan = { ...p }; render(); },
                title: "Editar texto"
              }, EditIcon(14)),
              h("button", {
                class: "icon-btn",
                onClick: () => {
                  if (confirm(`¿Eliminar la idea "${p.title}"?`)) {
                    saveList(state.house, "dates_plans", plans.filter((x) => x.id !== p.id));
                  }
                },
                title: "Eliminar"
              }, TrashIcon(14))
            )
          );
        }));

    return h("div", {}, addForm, filterPills, listBody);
  }

  /* ---------- tab: calendario ---------- */
  function buildCalendarioTab() {
    const { year, month } = state.calCursor;
    const firstDay = new Date(year, month, 1);
    const startOffset = (firstDay.getDay() + 6) % 7;
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const cells = [];
    for (let i = 0; i < startOffset; i++) cells.push(null);
    for (let d = 1; d <= daysInMonth; d++) cells.push(d);
    const isoFor = (d) => `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    const eventsFor = (iso) => state.events.filter((e) => e.date === iso);
    const today = todayISO();
    const changeMonth = (delta) => {
      let m = month + delta, y = year;
      if (m < 0) { m = 11; y -= 1; }
      if (m > 11) { m = 0; y += 1; }
      state.calCursor = { year: y, month: m };
      render();
    };
    const dayEvents = eventsFor(state.calSelected);

    const titleInput = h("input", { id: "input-cal-title", placeholder: "Agregar algo a este día…", value: "", style: { flex: "1" } });
    const addBtn = h("button", { class: "add-btn", disabled: true }, PlusIcon(15));
    const addEvent = () => {
      if (!titleInput.value.trim()) return;
      const titleVal = titleInput.value.trim();
      resetFormFields("input-cal-title");
      titleInput.value = "";
      addBtn.disabled = true;
      saveList(state.house, "events", [...state.events, { id: uid(), title: titleVal, date: state.calSelected, createdBy: state.me.name }]);
    };
    titleInput.addEventListener("input", () => { addBtn.disabled = !titleInput.value.trim(); });
    titleInput.addEventListener("keydown", (e) => { if (e.key === "Enter") addEvent(); });
    addBtn.addEventListener("click", addEvent);
    const remove = (id) => saveList(state.house, "events", state.events.filter((e) => e.id !== id));

    const header = h("div", { class: "cal-header" },
      h("button", { class: "cal-nav-btn", onClick: () => changeMonth(-1) }, ChevronLeftIcon(16)),
      h("h3", { style: { fontFamily: "Fraunces, serif", fontSize: "1.1rem", textTransform: "capitalize" } }, `${MESES[month]} ${year}`),
      h("button", { class: "cal-nav-btn", onClick: () => changeMonth(1) }, ChevronRightIcon(16))
    );

    const grid = h("div", { class: "cal-grid" },
      ...DIAS_SEMANA.map((d) => h("div", { class: "cal-dow" }, d)),
      ...cells.map((d) => {
        if (d === null) return h("div", { class: "cal-day empty" });
        const iso = isoFor(d);
        const dayEvs = eventsFor(iso);
        return h("button", { class: "cal-day" + (iso === today ? " today" : "") + (iso === state.calSelected ? " selected" : ""), onClick: () => { state.calSelected = iso; render(); } },
          String(d),
          h("div", { class: "dots" }, ...dayEvs.slice(0, 3).map((e) => h("span", { class: "dot", style: { background: iso === state.calSelected ? "#fff" : colorFor(e.createdBy) } })))
        );
      })
    );

    const panel = h("div", { class: "day-panel" },
      h("h3", {}, new Date(state.calSelected + "T00:00:00").toLocaleDateString("es-AR", { weekday: "long", day: "numeric", month: "long" })),
      dayEvents.length === 0
        ? h("p", { style: { color: "var(--ink-muted)", fontSize: "0.88rem", marginBottom: "1rem" } }, "No hay nada anotado este día.")
        : h("div", {}, ...dayEvents.map((e) => h("div", { class: "list-row", style: { "--row-color": colorFor(e.createdBy) } },
            h("div", { class: "row-main" }, h("div", { class: "row-title" }, e.title), h("div", { class: "row-meta" }, h("span", {}, e.createdBy))),
            h("button", { class: "icon-btn", onClick: () => remove(e.id) }, TrashIcon(15))
          ))),
      h("div", { style: { display: "flex", gap: "0.5rem", marginTop: "0.5rem" } }, titleInput, addBtn)
    );

    return h("div", {}, header, grid, panel);
  }

  /* ---------- raíz + render ---------- */
  function buildApp() {
    if (!fbReady) return buildConfigMissing();
    if (!state.house || state.houseAuthed !== state.house) return buildHouseScreen();
    if (!state.me) return buildIdentityGate();
    return buildHomeApp();
  }

  const root = document.getElementById("root");
  function render() {
    if (state.activeTab !== "citas" || state.citasSubTab !== "indeciso") {
      if (animFrameId) {
        cancelAnimationFrame(animFrameId);
        animFrameId = null;
      }
      state.isSpinning = false;
    } else if (animFrameId && !state.isSpinning) {
      cancelAnimationFrame(animFrameId);
      animFrameId = null;
    }
    const active = document.activeElement;
    const activeId = active && active.id ? active.id : null;
    const selStart = active && typeof active.selectionStart === "number" ? active.selectionStart : null;
    const selEnd = active && typeof active.selectionEnd === "number" ? active.selectionEnd : null;

    // Cualquier cosa sin confirmar en un campo (id-eado) sobrevive al redibujado,
    // EXCEPTO los campos marcados explícitamente para reseteo al presionar 'Agregar'.
    const snapshot = {};
    root.querySelectorAll("input[id], select[id], textarea[id]").forEach((elx) => {
      if (inputsToReset.has(elx.id)) return;
      snapshot[elx.id] = elx.type === "checkbox" || elx.type === "radio" ? { checked: elx.checked } : { value: elx.value };
    });
    const justReset = new Set(inputsToReset);
    inputsToReset.clear();

    pendingAutofocus = null;
    root.innerHTML = "";
    root.appendChild(buildApp());
    document.body.style.overflow = (state.mobileMenuOpen || state.viewingReceipt) ? "hidden" : "";

    for (const id in snapshot) {
      const again = document.getElementById(id);
      if (!again) continue;
      if ("checked" in snapshot[id]) again.checked = snapshot[id].checked;
      else again.value = snapshot[id].value;
      again.dispatchEvent(new Event("input", { bubbles: true }));
    }

    let restored = false;
    if (activeId && !justReset.has(activeId)) {
      const again = document.getElementById(activeId);
      if (again) {
        again.focus();
        if (selStart != null && typeof again.setSelectionRange === "function") {
          try { again.setSelectionRange(selStart, selEnd); } catch (e) {}
        }
        restored = true;
      }
    }
    if (!restored && pendingAutofocus) pendingAutofocus.focus();
  }

  render();
})();
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./service-worker.js").catch(() => {});
    });
  }
</script>
</body>
</html>
