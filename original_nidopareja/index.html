<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#23301F" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Nido" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<title>Nido — organización en pareja</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  html, body, #root { height: 100%; margin: 0; }
  * { box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; }

  .nido {
    --bg: #EFF1E9; --surface: #FFFFFF; --surface-muted: #F7F8F2;
    --ink: #23301F; --ink-muted: #5C6B54; --line: #D8DCC9;
    --warn: #C98A2C; --bad: #B03A2E; --good: #3F7D5C;
    color: var(--ink); background: var(--bg); min-height: 100vh; display: flex; width: 100%;
  }
  .nido h1, .nido h2, .nido h3 { font-family: 'Fraunces', serif; font-weight: 600; margin: 0; }
  .nido button { font-family: inherit; cursor: pointer; }
  .nido input, .nido select { font-family: inherit; font-size: 0.9rem; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 0.5rem 0.65rem; outline: none; }
  .nido input:focus, .nido select:focus { border-color: var(--ink-muted); }

  .identity-wrap { min-height: 100vh; width: 100%; display: flex; align-items: center; justify-content: center; padding: 2rem 1.25rem; }
  .identity-card { max-width: 420px; width: 100%; }
  .identity-card h1 { font-size: 2rem; margin-bottom: 0.35rem; }
  .identity-card p { color: var(--ink-muted); margin: 0 0 1.75rem; line-height: 1.5; }
  .member-chip { display: flex; align-items: center; gap: 0.6rem; width: 100%; text-align: left; padding: 0.75rem 1rem; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); margin-bottom: 0.6rem; font-size: 0.95rem; }
  .member-chip:hover { border-color: var(--ink-muted); }
  .swatch { width: 12px; height: 12px; border-radius: 50%; flex: none; display:inline-block; }
  .form-block { margin-top: 1rem; border-top: 1px solid var(--line); padding-top: 1.25rem; }
  .form-block label { font-size: 0.8rem; color: var(--ink-muted); display: block; margin-bottom: 0.4rem; }
  .form-block input { width: 100%; margin-bottom: 0.9rem; }
  .color-picker { display: flex; gap: 0.5rem; margin-bottom: 1.1rem; }
  .color-dot { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; padding: 0; flex: none; }
  .color-dot.selected { border-color: var(--ink); }
  .primary-btn { background: var(--ink); color: #fff; border: none; border-radius: 8px; padding: 0.65rem 1.1rem; font-size: 0.9rem; font-weight: 500; }
  .primary-btn:disabled { opacity: 0.4; cursor: default; }
  .ghost-btn { background: transparent; color: var(--ink-muted); border: none; padding: 0.65rem 1.1rem; font-size: 0.9rem; }
  .helper-text { font-size: 0.78rem; color: var(--ink-muted); margin-top: -0.4rem; margin-bottom: 0.9rem; line-height: 1.4; }

  .sidebar { width: 220px; flex: none; border-right: 1px solid var(--line); padding: 1.5rem 1.1rem; display: flex; flex-direction: column; gap: 1.75rem; }
  .brand-row { display: flex; align-items: center; justify-content: space-between; }
  .brand h1 { font-size: 1.5rem; font-style: italic; }
  .brand-sub { font-size: 0.78rem; color: var(--ink-muted); margin-top: 0.15rem; }
  .drawer-close { display: none; border: none; background: none; color: var(--ink-muted); padding: 0.2rem; }
  .nav { display: flex; flex-direction: column; gap: 0.2rem; flex: 1; }
  .nav-item { display: flex; align-items: center; gap: 0.6rem; padding: 0.55rem 0.6rem; border: none; background: none; border-radius: 8px; color: var(--ink-muted); font-size: 0.9rem; text-align: left; }
  .nav-item.active { background: var(--surface); color: var(--ink); font-weight: 600; }
  .me-row { display: flex; align-items: center; gap: 0.5rem; font-size: 0.82rem; color: var(--ink-muted); border-top: 1px solid var(--line); padding-top: 1rem; }
  .switch-user { border: none; background: none; color: var(--ink-muted); font-size: 0.78rem; display: flex; align-items: center; gap: 0.3rem; padding: 0; margin-top: 0.4rem; }
  .switch-user:hover { color: var(--ink); }

  .mobile-topbar { display: none; }
  .drawer-backdrop { display: none; }
  .receipt-modal-backdrop { position: fixed; inset: 0; background: rgba(20, 24, 16, 0.6); z-index: 60; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
  .receipt-modal { background: var(--bg); border-radius: 14px; padding: 0.9rem; max-width: 480px; width: 100%; display: flex; flex-direction: column; gap: 0.5rem; box-shadow: 0 12px 40px rgba(0,0,0,0.25); }

  .main { flex: 1; padding: 2rem 2.5rem; max-width: 900px; }
  .main-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.75rem; }
  .main-header h2 { font-size: 1.6rem; }
  .main-header p { color: var(--ink-muted); margin: 0.25rem 0 0; font-size: 0.92rem; }
  .sync-badge { display: flex; align-items: center; gap: 0.35rem; border: 1px solid var(--line); background: var(--surface); border-radius: 20px; padding: 0.4rem 0.8rem; font-size: 0.78rem; color: var(--ink-muted); }
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }

  .empty-state { padding: 2.5rem 1.5rem; text-align: center; border: 1px dashed var(--line); border-radius: 12px; color: var(--ink-muted); font-size: 0.92rem; line-height: 1.6; }

  .entry-form { background: var(--surface-muted); border: 1px solid var(--line); border-radius: 12px; padding: 1rem 1.1rem; margin-bottom: 1.5rem; display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 0.3rem; }
  .field label { font-size: 0.72rem; color: var(--ink-muted); }
  .field input, .field select { min-width: 120px; }
  .field.grow { flex: 1; min-width: 160px; }
  .add-btn { display: flex; align-items: center; gap: 0.35rem; background: var(--ink); color: #fff; border: none; border-radius: 8px; padding: 0.55rem 0.9rem; font-size: 0.85rem; height: fit-content; }
  .add-btn:disabled { opacity: 0.4; }

  .list-row { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 0.9rem; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--row-color, var(--line)); border-radius: 10px; margin-bottom: 0.55rem; }
  .list-row.done { opacity: 0.55; }
  .row-main { flex: 1; min-width: 0; }
  .row-title { font-size: 0.94rem; font-weight: 500; }
  .row-title.strike { text-decoration: line-through; }
  .row-meta { font-size: 0.78rem; color: var(--ink-muted); margin-top: 0.15rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .row-amount { font-weight: 600; font-size: 0.95rem; white-space: nowrap; }
  .pill { font-size: 0.7rem; padding: 0.15rem 0.55rem; border-radius: 20px; font-weight: 600; white-space: nowrap; }
  .pill.warn { background: #F5E4C2; color: #7A5518; }
  .pill.bad { background: #F3D6D1; color: #7C2A20; }
  .pill.good { background: #D9EBE0; color: #245A3D; }
  .icon-btn { border: none; background: none; color: var(--ink-muted); padding: 0.3rem; border-radius: 6px; flex: none; }
  .icon-btn:hover { color: var(--bad); background: var(--surface-muted); }
  .check-btn { border: 1.5px solid var(--line); background: var(--surface); width: 22px; height: 22px; border-radius: 6px; flex: none; display: flex; align-items: center; justify-content: center; padding: 0; }
  .check-btn.checked { background: var(--good); border-color: var(--good); color: #fff; }
  .day-pill { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 30px; border: 1px solid var(--line); border-radius: 8px; font-size: 0.76rem; cursor: pointer; user-select: none; background: var(--surface); color: var(--ink-muted); }
  .day-pill input { display: none; }
  .day-pill.checked { background: var(--ink); color: #fff; border-color: var(--ink); }
  .schedule-list { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.4rem; }

  .summary { display: flex; gap: 1.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
  .summary-card { flex: 1; min-width: 160px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 0.9rem 1rem; }
  .summary-card .label { font-size: 0.75rem; color: var(--ink-muted); display: flex; align-items: center; gap: 0.4rem; }
  .summary-card .value { font-family: 'Fraunces', serif; font-size: 1.4rem; margin-top: 0.25rem; }
  .bar-track { height: 6px; border-radius: 4px; background: var(--surface-muted); margin-top: 0.5rem; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; }

  .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
  .cal-nav-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; color: var(--ink-muted); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.4rem; margin-bottom: 1.75rem; }
  .cal-dow { text-align: center; font-size: 0.72rem; color: var(--ink-muted); padding-bottom: 0.3rem; }
  .cal-day { aspect-ratio: 1; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 0.35rem; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; font-size: 0.82rem; position: relative; }
  .cal-day.empty { visibility: hidden; }
  .cal-day.today { border-color: var(--ink); font-weight: 700; }
  .cal-day.selected { background: var(--ink); color: #fff; }
  .cal-day .dots { display: flex; gap: 2px; margin-top: 0.3rem; }
  .cal-day .dot { width: 5px; height: 5px; border-radius: 50%; }
  .day-panel { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 1.1rem 1.2rem; }
  .day-panel h3 { font-size: 1.05rem; margin-bottom: 0.75rem; }

  @media (max-width: 760px) {
    .nido { flex-direction: column; }

    .mobile-topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: calc(0.85rem + env(safe-area-inset-top, 0px)) 1rem 0.85rem;
      border-bottom: 1px solid var(--line); background: var(--bg);
      position: sticky; top: 0; z-index: 20;
    }
    .brand-trigger { display: flex; align-items: center; gap: 0.5rem; border: none; background: none; padding: 0.2rem; color: var(--ink); }
    .brand-trigger h1 { font-size: 1.35rem; font-style: italic; }
    .mobile-topbar-tab { font-size: 0.85rem; color: var(--ink-muted); }

    .drawer-backdrop {
      display: block; position: fixed; inset: 0; background: rgba(20, 24, 16, 0.45);
      z-index: 45; opacity: 0; pointer-events: none; transition: opacity 0.22s ease;
    }
    .drawer-backdrop.open { opacity: 1; pointer-events: auto; }

    .sidebar {
      position: fixed; top: 0; left: 0; height: 100vh; height: 100dvh; width: 82%; max-width: 300px;
      background: var(--bg); border-right: 1px solid var(--line); z-index: 50;
      transform: translateX(-100%); transition: transform 0.25s ease;
      overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: calc(1.25rem + env(safe-area-inset-top, 0px)) 1.1rem calc(1.25rem + env(safe-area-inset-bottom, 0px));
      box-shadow: 2px 0 18px rgba(0,0,0,0.12);
    }
    .sidebar.open { transform: translateX(0); }
    .drawer-close { display: block; }
    .brand-sub { display: block; }
    .nav-item span { display: inline; }
    .me-row { display: flex; }

    .main { padding: 1.25rem 1.1rem; }
    .entry-form { flex-direction: column; align-items: stretch; }
    .field input, .field select { min-width: 0; width: 100%; }
  }

  /* Estilos agregados para Citas y Planes + Notificaciones */
  .subtabs { display: flex; gap: 0.5rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
  .subtab-btn {
    padding: 0.45rem 0.95rem; font-size: 0.85rem; font-weight: 500;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink-muted);
    border-radius: 20px; cursor: pointer; transition: all 0.15s ease;
    display: inline-flex; align-items: center; gap: 0.35rem;
  }
  .subtab-btn.active {
    background: var(--ink); color: #fff; border-color: var(--ink); font-weight: 600;
  }
  .roulette-container {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    padding: 1.5rem 1rem; margin-bottom: 1.5rem; position: relative;
  }
  .canvas-wrapper {
    position: relative;
    width: 290px;
    height: 290px;
    margin: 0.75rem auto 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
  }
  .needle {
    position: absolute; top: -8px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 13px solid transparent; border-right: 13px solid transparent;
    border-top: 22px solid var(--bad); z-index: 10;
    filter: drop-shadow(0 2px 5px rgba(0,0,0,0.35));
    pointer-events: none;
  }
  .roulette-spin-btn {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 54px; height: 54px; border-radius: 50%; padding: 0;
    font-weight: 800; font-size: 0.78rem; letter-spacing: 0.5px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(0,0,0,0.28); border: 2.5px solid #FFFFFF; z-index: 5;
    cursor: pointer; transition: transform 0.1s ease, box-shadow 0.15s ease;
  }
  .roulette-spin-btn:active:not(:disabled) {
    transform: translate(-50%, -50%) scale(0.94);
  }
  .winner-banner {
    background: #FAF7EE; border: 1.5px solid var(--warn); border-radius: 14px;
    padding: 1rem 1.2rem; margin: 1rem 0; width: 100%; max-width: 440px; text-align: center;
    box-shadow: 0 4px 14px rgba(201, 138, 44, 0.12);
  }
  .winner-title { font-family: 'Fraunces', serif; font-size: 1.25rem; color: var(--ink); margin: 0.25rem 0 0.5rem; }
  .winner-actions { display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; margin-top: 0.75rem; }
  
  .alert-toast {
    position: fixed; top: calc(1rem + env(safe-area-inset-top, 0px)); right: 1rem; left: 1rem;
    max-width: 440px; margin: 0 auto; background: var(--surface); border: 1px solid var(--line);
    border-left: 5px solid var(--warn); box-shadow: 0 12px 35px rgba(0,0,0,0.18);
    border-radius: 12px; padding: 0.85rem 1rem; display: flex; align-items: center;
    gap: 0.75rem; z-index: 100; animation: toastSlide 0.25s ease;
  }
  @keyframes toastSlide { from { opacity: 0; transform: translateY(-15px); } to { opacity: 1; transform: translateY(0); } }
  
  .bell-btn {
    border: 1px solid var(--line); background: var(--surface); border-radius: 20px;
    padding: 0.35rem 0.75rem; font-size: 0.78rem; color: var(--ink);
    display: flex; align-items: center; gap: 0.4rem; cursor: pointer;
  }
  .bell-btn:hover { border-color: var(--ink); }
  .bell-modal-backdrop {
    position: fixed; inset: 0; background: rgba(20, 24, 16, 0.5); z-index: 65;
    display: flex; align-items: center; justify-content: center; padding: 1.25rem;
  }
  .bell-modal {
    background: var(--bg); border-radius: 16px; padding: 1.25rem; max-width: 420px;
    width: 100%; box-shadow: 0 16px 45px rgba(0,0,0,0.22); border: 1px solid var(--line);
  }
  .bell-quick-list { display: flex; flex-direction: column; gap: 0.5rem; margin: 1rem 0; }
  .bell-quick-item {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 0.65rem 0.9rem; text-align: left; font-size: 0.88rem; color: var(--ink);
    cursor: pointer; display: flex; align-items: center; gap: 0.6rem; transition: border-color 0.15s;
  }
  .bell-quick-item:hover { border-color: var(--ink); background: var(--surface-muted); }
  .plan-card {
    display: flex; align-items: flex-start; gap: 0.75rem; padding: 0.85rem 1rem;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 0.6rem;
  }
  .plan-card-body { flex: 1; min-width: 0; }
  .plan-card-title { font-size: 0.95rem; font-weight: 600; color: var(--ink); margin-bottom: 0.2rem; }
  .plan-card-desc { font-size: 0.82rem; color: var(--ink-muted); line-height: 1.4; margin-top: 0.2rem; }
  .plan-actions { display: flex; gap: 0.35rem; align-items: center; flex: none; }

  /* ---------- Modo Oscuro ---------- */
  body.dark {
    background: #141A13;
  }
  .nido.dark, body.dark .nido {
    --bg: #151C14;
    --surface: #1E271D;
    --surface-muted: #263224;
    --ink: #EAF0E7;
    --ink-muted: #A3B59D;
    --line: #2E3C2B;
    --warn: #E4A94B;
    --bad: #E06D60;
    --good: #5EB386;
    color-scheme: dark;
  }
  .nido.dark .primary-btn,
  .nido.dark .add-btn,
  .nido.dark .subtab-btn.active {
    background: #EAF0E7;
    color: #141A13;
    border-color: #EAF0E7;
  }
  .nido.dark .primary-btn:hover,
  .nido.dark .add-btn:hover,
  .nido.dark .subtab-btn.active:hover {
    background: #D8E0D5;
  }
  .nido.dark .cal-day.selected {
    background: #EAF0E7;
    color: #141A13;
  }
  .nido.dark .cal-day.today {
    border-color: #EAF0E7;
  }
  .nido.dark .day-pill.checked {
    background: #EAF0E7;
    color: #141A13;
    border-color: #EAF0E7;
  }
  .nido.dark .pill.warn { background: rgba(228, 169, 75, 0.22); color: #F7D488; }
  .nido.dark .pill.bad { background: rgba(224, 109, 96, 0.22); color: #FCA59C; }
  .nido.dark .pill.good { background: rgba(94, 179, 134, 0.22); color: #8BE0B1; }
  .nido.dark .winner-banner {
    background: #252D1F;
    border-color: var(--warn);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
  }
  .nido.dark .roulette-spin-btn {
    border-color: #263224;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
  }
  .nido.dark .bell-quick-item:hover {
    background: var(--surface-muted);
  }

  /* Selector de tema accesible a simple vista */
  .theme-toggle-group {
    display: inline-flex;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 2px;
    gap: 2px;
    flex: none;
  }
  .theme-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--ink-muted);
    cursor: pointer;
    transition: all 0.15s ease;
    padding: 0;
  }
  .theme-btn:hover {
    color: var(--ink);
  }
  .theme-btn.active {
    background: var(--ink);
    color: var(--bg);
  }
  .nido.dark .theme-btn.active {
    background: #EAF0E7;
    color: #141A13;
  }

</style>

<body>
<div id="root"></div>

<!-- Firebase (Realtime Database) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<!-- Tu configuración de Firebase -->
<script src="./firebase-config.js"></script>

<!-- Nido, en JavaScript puro (sin React ni Babel: nada que se pueda romper en producción) -->
<script>
(function () {
  "use strict";

  /* ---------- Firebase init ---------- */
  let fbReady = false;
  try {
    if (firebaseConfig.apiKey !== "PEGAR_ACA") {
      firebase.initializeApp(firebaseConfig);
      fbReady = true;
    }
  } catch (e) {
    console.error("Error inicializando Firebase:", e);
  }

  /* ---------- helpers para construir DOM sin JSX ---------- */
  function h(tag, opts, ...children) {
    const node = document.createElement(tag);
    opts = opts || {};
    for (const key in opts) {
      const val = opts[key];
      if (val == null || val === false) continue;
      if (key === "class") node.className = val;
      else if (key === "style" && typeof val === "object") {
        for (const sk in val) {
          if (sk.indexOf("--") === 0) node.style.setProperty(sk, val[sk]);
          else node.style[sk] = val[sk];
        }
      } else if (key.indexOf("on") === 0 && typeof val === "function") {
        node.addEventListener(key.slice(2).toLowerCase(), val);
      } else if (val === true) {
        node.setAttribute(key, "");
      } else {
        node.setAttribute(key, val);
      }
    }
    for (const child of children.flat(Infinity)) {
      if (child == null || child === false) continue;
      node.appendChild(child.nodeType ? child : document.createTextNode(String(child)));
    }
    return node;

  function getAudioCtx() {

  function playDingDong() {
    try {
      const ctx = getAudioCtx();
      if (!ctx) return;
      const now = ctx.currentTime;
      // Ding (E5)
      const osc1 = ctx.createOscillator();
      const gain1 = ctx.createGain();
      osc1.type = "sine";
      osc1.frequency.setValueAtTime(659.25, now);
      gain1.gain.setValueAtTime(0, now);
      gain1.gain.linearRampToValueAtTime(0.28, now + 0.04);
      gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
      osc1.connect(gain1);
      gain1.connect(ctx.destination);
      osc1.start(now);
      osc1.stop(now + 0.6);

      // Dong (C5)
      const osc2 = ctx.createOscillator();
      const gain2 = ctx.createGain();
      osc2.type = "sine";
      osc2.frequency.setValueAtTime(523.25, now + 0.24);
      gain2.gain.setValueAtTime(0, now + 0.24);
      gain2.gain.linearRampToValueAtTime(0.32, now + 0.28);
      gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.95);
      osc2.connect(gain2);
      gain2.connect(ctx.destination);
      osc2.start(now + 0.24);
      osc2.stop(now + 1.0);
    } catch (e) {}
  }

      osc.type = "triangle";
      osc.frequency.setValueAtTime(520, now);

      osc.start(now);

  }

    try {
      const ctx = getAudioCtx();

      const notes = [523.25, 659.25, 783.99, 1046.5]; // C5, E5, G5, C6

        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.2, now + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.001, now + (idx === 3 ? 0.65 : 0.25));
        osc.connect(gain);
        gain.connect(ctx.destination);

  // Convierte números en formato argentino ("1.234,56", "12.500" o "1234,56") a Number.
  function parseArNumber(str) {
    let s = String(str).replace(/[^\d.,]/g, "");
    if (s.includes(".") && s.includes(",")) {
      // Los dos separadores presentes: el punto siempre es de miles, la coma es decimal.
      s = s.replace(/\./g, "").replace(",", ".");
    } else if (s.includes(",")) {
      // Solo coma: es el separador decimal.
      s = s.replace(",", ".");
    } else if (s.includes(".")) {
      const parts = s.split(".");
      const last = parts[parts.length - 1];
      if (parts.length > 2 || last.length === 3) {
        // Más de un punto, o un solo punto seguido de 3 dígitos: son separadores de miles ("12.500" = 12500).
        s = parts.join("");
      }
      // Un solo punto seguido de 1-2 dígitos ("12.5" o "12.50"): se interpreta como decimal, se deja igual.
    }
    return parseFloat(s);
  }
  // Heurísticas simples para adivinar monto, fecha, descripción y categoría a partir del texto leído.
  const CATEGORY_KEYWORDS = [
    { cat: "Supermercado", words: ["supermercado", "market", "almacen", "hipermercado", "carrefour", "coto", "dia %", "disco", "jumbo", "chino", "verduleria", "carniceria", "kiosco"] },

    { cat: "Expensas/Servicios", words: ["expensas", "edenor", "edesur", "metrogas", "aysa", "telecom", "movistar", "personal", "claro", "internet", "consorcio", "abl", " gas ", "factura de servicio"] },
    { cat: "Alquiler", words: ["alquiler", "inmobiliaria", " renta "] },
  ];
  function guessCategory(text) {
    const norm = " " + text.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "") + " ";
    for (const group of CATEGORY_KEYWORDS) {
      if (group.words.some((w) => norm.includes(w))) return group.cat;
    }
    return null;
  }
  function extractInvoiceData(rawText) {
    const lines = rawText.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
    // Montos agrupados de a 3 (miles) con o sin decimales, o números sueltos con hasta 2 decimales.
    const numberPattern = /\d{1,3}(?:[.,]\d{3})+(?:[.,]\d{1,2})?|\d+(?:[.,]\d{1,2})?/g;
    const totalKeywords = /total|importe|monto|a\s*pagar/i;
    let amount = null;
    for (const line of lines) {
      if (totalKeywords.test(line)) {
        const matches = line.match(numberPattern);
        if (matches && matches.length) {
          const val = parseArNumber(matches[matches.length - 1]);
          if (!isNaN(val) && val > 0) { amount = val; break; }
        }
      }
    }
    if (amount == null) {
      const values = (rawText.match(numberPattern) || []).map(parseArNumber).filter((v) => !isNaN(v) && v > 0);
      if (values.length) amount = Math.max(...values);
    }
    let date = null;
    const dateMatch = rawText.match(/\b(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})\b/);
    if (dateMatch) {
      let [, d, m, y] = dateMatch;
      if (y.length === 2) y = "20" + y;
      const candidate = `${y}-${m.padStart(2, "0")}-${d.padStart(2, "0")}`;
      if (!isNaN(new Date(candidate).getTime())) date = candidate;
    }
    let desc = null;
    for (const line of lines.slice(0, 6)) {
      if (/[a-zA-ZÀ-ÿ]{3,}/.test(line) && !/^\d+$/.test(line)) { desc = line.slice(0, 60); break; }
    }
    const category = guessCategory(rawText);
    return { amount, date, desc, category };
  }

  // Comprime una foto de ticket a JPEG chico (para poder guardarla junto al gasto sin pesar de más).
  function compressImageFile(file, maxDim, quality) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round(height * (maxDim / width)); width = maxDim; }
          else { width = Math.round(width * (maxDim / height)); height = maxDim; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        URL.revokeObjectURL(url);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("No se pudo procesar la imagen.")); };
      img.src = url;
    });
  }

  function notifiedKey(taskId, dateISO) { return `nido_notified_${taskId}_${dateISO}`; }
  function taskAppliesToday(t) {
    if (t.frequency === "dias") return (t.days || []).includes(todayWeekday());

  function taskDoneToday(t) {
    return t.frequency === "unica" ? !!t.done : t.doneDate === todayISO();

  function checkTaskNotifications() {
    if (!notifSupported || Notification.permission !== "granted") return;
    if (!state.house || !state.me) return;
    const today = todayISO();
    const hm = nowHM();
    state.tasks.forEach((t) => {
      if (!t.timeStart) return;
      if (!taskAppliesToday(t)) return;
      if (taskDoneToday(t)) return;
      if (t.timeStart !== hm) return;
      const key = notifiedKey(t.id, today);
      if (getLocal(key, false)) return;
      setLocal(key, true);
      try {
        new Notification("Nido — recordatorio", { body: `${t.title}${t.assignee && t.assignee !== "Cualquiera" ? " · " + t.assignee : ""}${t.timeEnd ? ` (hasta ${t.timeEnd})` : ""}`, tag: key });
      } catch (e) {}
    });
  }

  let lastSeenAlertTimestamp = Date.now();

  function handleIncomingAlerts(list) {
    state.alerts = list || [];
    if (!state.alerts.length) return;
    
    // Buscar la alerta más reciente
    const sorted = [...state.alerts].sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
    const newest = sorted[0];
    
    if (newest && newest.timestamp > lastSeenAlertTimestamp) {
      lastSeenAlertTimestamp = newest.timestamp;
      // Solo notificar si no fue enviada por mí mismo
      if (state.me && newest.fromUser !== state.me.name) {
        playDingDong();
        state.activeAlertToast = newest;
        
        // Notificación del sistema si está habilitada
        if (notifSupported && Notification.permission === "granted") {
          try {
            new Notification(`Nido · ${newest.fromUser}`, {
              body: newest.message,
              icon: "./icon-192.png",
              tag: `alert-${newest.id}`
            });
          } catch (e) {}
        }

        if (toastTimeout) clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
          state.activeAlertToast = null;
          render();
        }, 8000);
        render();
      }
    }
  }

  function sendHouseAlert(type, message) {

      message: message,
      timestamp: Date.now()

    const current = state.alerts || [];
    // Mantener las últimas 25 alertas
    const updated = [...current.slice(-24), alertObj];
    saveList(state.house, "alerts", updated);
  }

  function subscribeList(house, path, cb) {

    const listener = (snap) => {
      const val = snap.val();
      cb(Array.isArray(val) ? val : val ? Object.values(val) : []);
    };
    r.on("value", listener);
    return () => r.off("value", listener);
  }
  function saveList(house, path, list) {
    dbRef(house, path).set(list).catch((e) => console.error("Error guardando", path, e));
  }

  /* ---------- localStorage (identidad del dispositivo) ---------- */
  const getLocal = (k, fallback) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fallback; } catch { return fallback; } };
  const setLocal = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

    me: getLocal("nido_me", null),

    datesPlans: [], alerts: [],
    membersLoaded: false,
    activeTab: "gastos",

    rouletteOptions: ["Cena en casa", "Salir a comer", "Paseo y helado", "Noche de pelis"],
    rouletteWinner: null,
    isSpinning: false,
    editingPlan: null,
    planFilterTag: "Todos",
    activeAlertToast: null,
    bellModalOpen: false,

    identityColor: null,
    calCursor: (() => { const d = new Date(); return { year: d.getFullYear(), month: d.getMonth() }; })(),

    houseGateBusy: false,
    houseGateError: null,
    mobileMenuOpen: false,
    viewingReceipt: null,

  /* Reseteo controlado de campos al agregar para evitar que el render() los restaure */
  const inputsToReset = new Set();
  function resetFormFields(...ids) {
    ids.forEach((id) => {
      inputsToReset.add(id);
      const el = document.getElementById(id);
      if (el) {
        if (el.type === "checkbox" || el.type === "radio") {
          el.checked = false;
        } else if (el.tagName === "SELECT") {
          el.selectedIndex = 0;
        } else {
          el.value = "";
        }
      }
    });
  }

  function applyTheme() {
    const isDark = state.theme === "dark";
    if (document.documentElement) document.documentElement.classList.toggle("dark", isDark);
    if (document.body) document.body.classList.toggle("dark", isDark);
    const metaTheme = document.querySelector('meta[name="theme-color"]');
    if (metaTheme) metaTheme.setAttribute("content", isDark ? "#151C14" : "#23301F");
  }

  function setTheme(t) {
    state.theme = t;
    setLocal("nido_theme", t);
    applyTheme();
    render();
  }

  function buildThemeToggle() {
    const isDark = state.theme === "dark";
    const lightBtn = h("button", {
      class: "theme-btn" + (!isDark ? " active" : ""),
      type: "button",
      title: "Activar modo claro",
      "aria-label": "Activar modo claro",
      onClick: (e) => { e.stopPropagation(); setTheme("light"); }
    }, SunIcon(15));

    const darkBtn = h("button", {
      class: "theme-btn" + (isDark ? " active" : ""),
      type: "button",
      title: "Activar modo oscuro",
      "aria-label": "Activar modo oscuro",
      onClick: (e) => { e.stopPropagation(); setTheme("dark"); }
    }, MoonIcon(15));

    return h("div", { class: "theme-toggle-group", role: "group", "aria-label": "Selector de tema claro u oscuro" },
      lightBtn,

    );

  async function downloadProjectZip() {
    try {
      const res = await fetch("./download-zip");
      if (!res.ok) throw new Error("HTTP " + res.status);
      const blob = await res.blob();
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "nidopareja-actualizado.zip";
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        a.remove();
        window.URL.revokeObjectURL(url);
      }, 2500);
    } catch (err) {
      console.warn("Descarga por blob falló, usando navegación directa:", err);
      window.location.href = "./download-zip";
    }
  }

  applyTheme();

  let unsubHouse = null;
  function unsubscribeHouse() { if (unsubHouse) { unsubHouse(); unsubHouse = null; } }
  function subscribeHouse(house) {
    unsubscribeHouse();
    state.members = []; state.expenses = []; state.dues = []; state.tasks = []; state.events = []; state.fund = [];
    state.membersLoaded = false;
    const u1 = subscribeList(house, "members", (list) => { state.members = list; state.membersLoaded = true; render(); });
    const u2 = subscribeList(house, "expenses", (list) => { state.expenses = list; render(); });
    const u3 = subscribeList(house, "dues", (list) => { state.dues = list; render(); });
    const u4 = subscribeList(house, "tasks", (list) => { state.tasks = list; render(); checkTaskNotifications(); });
    const u5 = subscribeList(house, "events", (list) => { state.events = list; render(); });
    const u6 = subscribeList(house, "fund", (list) => { state.fund = list; render(); });
    const u7 = subscribeList(house, "dates_plans", (list) => {
      state.datesPlans = list && list.length > 0 ? list : DEFAULT_CITAS_PLANS;
      render();
    });
    const u8 = subscribeList(house, "alerts", (list) => {
      handleIncomingAlerts(list);
    });
    unsubHouse = () => { u1(); u2(); u3(); u4(); u5(); u6(); u7(); u8(); };
  }
  if (fbReady && state.house && state.houseAuthed === state.house) subscribeHouse(state.house);
  if (notifSupported) setInterval(checkTaskNotifications, 20000);

  // Verifica (o crea, si es la primera vez) el código+contraseña de la casa.
  // Devuelve { ok: true } o { ok: false, error: "..." }
  async function enterHouse(codeRaw, passwordRaw) {
    const code = codeRaw.trim().toLowerCase().replace(/\s+/g, "-");
    const password = passwordRaw;
    if (!code || !password) return { ok: false, error: "Completá el código y la contraseña." };
    const metaSnap = await firebase.database().ref(`nido/${code}/meta`).once("value");
    const meta = metaSnap.val();
    const hash = await hashPassword(password);
    if (!meta || !meta.passwordHash) {
      // Casa nueva: esta contraseña queda como la contraseña de la casa.
      await firebase.database().ref(`nido/${code}/meta`).set({ passwordHash: hash, createdAt: Date.now() });
    } else if (meta.passwordHash !== hash) {
      return { ok: false, error: "Código o contraseña incorrectos." };
    }
    state.house = code;
    state.houseAuthed = code;
    setLocal("nido_house", code);
    setLocal("nido_house_authed", code);
    subscribeHouse(code);
    return { ok: true };
  }

  function leaveHouse() {
    unsubscribeHouse();
    state.house = null; state.me = null; state.houseAuthed = null;
    setLocal("nido_house", null); setLocal("nido_me", null); setLocal("nido_house_authed", null);
    render();
  }
  function switchUser() { state.me = null; setLocal("nido_me", null); render(); }
  function toggleMobileMenu(force) {
    state.mobileMenuOpen = typeof force === "boolean" ? force : !state.mobileMenuOpen;
    render();
  }
  function chooseMember(member) {
    if (!state.members.some((m) => m.name === member.name)) {
      saveList(state.house, "members", [...state.members, member]);
    }
    state.me = member; setLocal("nido_me", member);
    state.identityAdding = false; state.identityColor = null;
    render();
  }
  function colorFor(name) {
    const m = state.members.find((mm) => mm.name === name);
    return m ? m.color : "#999";
  }
  function headerCopy(tab) {
    switch (tab) {
      case "gastos": return "Registren lo que va gastando cada uno para tener todo a la vista.";
      case "fondo": return "El pozo común de la casa, actualizado al instante para los dos.";
      case "vencimientos": return "Alquiler, expensas y servicios: que no se les pase ninguna fecha.";
      case "tareas": return "Lo que hay que hacer en casa, repartido entre los dos.";
      case "citas": return "Planes de a dos, ideas para salir o quedarse y una ruleta para cuando no se deciden.";
      case "calendario": return "Fechas importantes para los dos.";
      default: return "";
    }
  }
  function fundBalance() {
    return state.fund.reduce((s, m) => s + (m.type === "ingreso" ? m.amount : -m.amount), 0);
  }
  function dueStatus(due) {
    if (due.paid) return { label: "Pagado", cls: "good" };
    const days = Math.floor((new Date(due.dueDate) - new Date(todayISO())) / 86400000);
    if (days < 0) return { label: "Vencido", cls: "bad" };
    if (days <= 5) return { label: days === 0 ? "Vence hoy" : `Vence en ${days}d`, cls: "warn" };
    return { label: "Al día", cls: "good" };
  }

  /* ---------- pantalla: código de casa + contraseña ---------- */
  function buildHouseScreen() {
    const codeInput = h("input", { id: "input-house-code", placeholder: "Ej: casa-verde-2026", value: getLocal("nido_last_house_code", "") });
    const passInput = h("input", { id: "input-house-pass", type: "password", placeholder: "Contraseña de la casa", value: "" });
    const submitBtn = h("button", { class: "primary-btn", disabled: state.houseGateBusy }, state.houseGateBusy ? "Verificando…" : "Entrar");
    const updateBtn = () => { submitBtn.disabled = state.houseGateBusy || !codeInput.value.trim() || !passInput.value; };
    const submit = async () => {
      if (!codeInput.value.trim() || !passInput.value || state.houseGateBusy) return;
      state.houseGateBusy = true; state.houseGateError = null; render();
      setLocal("nido_last_house_code", codeInput.value.trim());
      const result = await enterHouse(codeInput.value, passInput.value);
      state.houseGateBusy = false;
      if (!result.ok) state.houseGateError = result.error;
      render();
    };
    codeInput.addEventListener("input", updateBtn);
    passInput.addEventListener("input", updateBtn);
    codeInput.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
    passInput.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
    submitBtn.addEventListener("click", submit);
    pendingAutofocus = codeInput.value ? passInput : codeInput;

    return h("div", { class: "nido" + (state.theme === "dark" ? " dark" : "") },

  /* ---------- pantalla: elegir quién sos ---------- */
  function buildIdentityGate() {
    if (!state.membersLoaded) {
      return h("div", { class: "nido" + (state.theme === "dark" ? " dark" : ""), style: { alignItems: "center", justifyContent: "center" } },
        h("p", { style: { color: "#5C6B54" } }, "Conectando con tu casa…")
      );
    }

    const usedColors = state.members.map((m) => m.color);
    const defaultColor = PALETTE.find((c) => !usedColors.includes(c)) || PALETTE[0];
    const currentColor = state.identityColor || defaultColor;

    const nameInput = h("input", { id: "input-identity-name", placeholder: "Ej: Juli", value: "" });
    const submitBtn = h("button", { class: "primary-btn", disabled: true }, "Entrar");
    const submit = () => { const clean = nameInput.value.trim(); if (!clean) return; chooseMember({ name: clean, color: currentColor }); };
    nameInput.addEventListener("input", () => { submitBtn.disabled = !nameInput.value.trim(); });
    nameInput.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
    submitBtn.addEventListener("click", submit);

    const showForm = state.identityAdding || state.members.length === 0;
    if (showForm) pendingAutofocus = nameInput;

    const headerRow = h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "0.75rem" } },
      h("span", { style: { fontFamily: "Fraunces, serif", fontStyle: "italic", fontSize: "1.3rem", fontWeight: "600", color: "var(--ink)" } }, "Nido"),
      buildThemeToggle()
    );
    const children = [headerRow, h("h1", {}, "¿Quién sos?"), h("p", {}, "Casa: ", h("strong", {}, state.house))];

    if (state.members.length > 0 && !state.identityAdding) {
      state.members.forEach((m) => {
        children.push(h("button", { class: "member-chip", onClick: () => chooseMember(m) },
          h("span", { class: "swatch", style: { background: m.color } }), " " + m.name

      });
      children.push(h("button", { class: "member-chip", style: { color: "var(--ink-muted)", justifyContent: "center" }, onClick: () => { state.identityAdding = true; state.identityColor = null; render(); } }, "+ Soy otra persona"));
    }

    if (showForm) {
      children.push(

            submitBtn,
            state.members.length > 0 ? h("button", { class: "ghost-btn", onClick: () => { state.identityAdding = false; render(); } }, "Volver") : null
          )
        )
      );
    }

    children.push(h("button", { class: "ghost-btn", style: { marginTop: "1rem", padding: "0" }, onClick: () => leaveHouse() }, "← Cambiar de casa"));

    return h("div", { class: "nido" + (state.theme === "dark" ? " dark" : "") }, h("div", { class: "identity-wrap" }, h("div", { class: "identity-card" }, ...children)));

    const photoThumb = h("img", { style: { width: "42px", height: "42px", objectFit: "cover", borderRadius: "6px", border: "1px solid var(--line)" } });
    const removePhotoBtn = h("button", { class: "icon-btn", type: "button" }, XIcon(13));
    const photoPreview = h("div", { style: { display: "none", alignItems: "center", gap: "0.5rem", marginTop: "0.6rem" } },
      photoThumb, h("span", { style: { fontSize: "0.78rem", color: "var(--ink-muted)" } }, "Foto del ticket adjunta"), removePhotoBtn
    );
    let pendingReceiptPhoto = null;
    removePhotoBtn.addEventListener("click", () => { pendingReceiptPhoto = null; photoPreview.style.display = "none"; });

    ocrBtn.addEventListener("click", () => ocrInput.click());
    ocrInput.addEventListener("change", async () => {
      const file = ocrInput.files[0];
      if (!file) return;
      ocrBtn.disabled = true;
      ocrStatus.style.display = "block";
      ocrStatus.style.color = "";
      ocrStatus.textContent = "Guardando la foto…";
      try {
        pendingReceiptPhoto = await compressImageFile(file, 1000, 0.6);
        photoThumb.src = pendingReceiptPhoto;
        photoPreview.style.display = "flex";
      } catch (e) { /* si falla la compresión seguimos igual con la lectura de texto */ }
      ocrStatus.textContent = "Descargando el lector (solo la primera vez)…";
      try {
        const text = await runOcr(file, (pct) => { ocrStatus.textContent = `Leyendo la factura… ${pct}%`; });
        const data = extractInvoiceData(text);
        if (data.desc) { descInput.value = data.desc; descInput.dispatchEvent(new Event("input", { bubbles: true })); }
        if (data.amount != null) { amountInput.value = data.amount; amountInput.dispatchEvent(new Event("input", { bubbles: true })); }
        if (data.date) { dateInput.value = data.date; dateInput.dispatchEvent(new Event("input", { bubbles: true })); }
        if (data.category) categorySelect.value = data.category;
        updateAddBtn();
        ocrStatus.textContent = (data.amount != null || data.date || data.desc)
          ? "Listo. Revisá los datos antes de guardar — la lectura automática puede equivocarse."
          : "No pude reconocer datos en la foto, pero quedó guardada para revisarla después. Cargá los datos a mano.";
      } catch (e) {
        ocrStatus.style.color = "var(--bad)";
        ocrStatus.textContent = (pendingReceiptPhoto ? "No pude leer el texto, pero la foto quedó guardada. " : "") + (e.message || "No se pudo leer la factura. Cargá los datos a mano.");
      } finally {
        ocrBtn.disabled = false;
        ocrInput.value = "";
      }
    });

    const submitGasto = () => {
      if (!descInput.value.trim() || !amountInput.value) return;
      const descVal = descInput.value.trim();
      const amountVal = Number(amountInput.value);
      const catVal = categorySelect.value;
      const dateVal = dateInput.value;
      const fromFund = fundCheckbox.checked;
      const fundTxId = fromFund ? uid() : null;
      const receiptPhotoVal = pendingReceiptPhoto;

      resetFormFields("input-gastos-desc", "input-gastos-amount", "input-gastos-fund");
      descInput.value = "";
      amountInput.value = "";
      categorySelect.selectedIndex = 0;
      dateInput.value = todayISO();
      fundCheckbox.checked = false;
      pendingReceiptPhoto = null;
      photoPreview.style.display = "none";
      ocrStatus.style.display = "none";
      updateAddBtn();

      const entry = { id: uid(), desc: descVal, amount: amountVal, category: catVal, date: dateVal, paidBy: fromFund ? FUND_PAYER : state.me.name, loggedBy: state.me.name, fromFund, fundTxId, receiptPhoto: receiptPhotoVal };
      saveList(state.house, "expenses", [entry, ...state.expenses]);
      if (fromFund) {
        saveList(state.house, "fund", [{ id: fundTxId, type: "gasto", amount: amountVal, desc: entry.desc, createdBy: state.me.name, date: dateVal }, ...state.fund]);
      }
    };

    addBtn.addEventListener("click", submitGasto);
    descInput.addEventListener("keydown", (e) => { if (e.key === "Enter") amountInput.focus(); });
    amountInput.addEventListener("keydown", (e) => { if (e.key === "Enter" && !addBtn.disabled) submitGasto(); });

    const totals = {};
    state.members.forEach((m) => (totals[m.name] = 0));
    state.expenses.forEach((e) => { if (!e.fromFund) totals[e.paidBy] = (totals[e.paidBy] || 0) + e.amount; });
    const maxTotal = Math.max(1, ...Object.values(totals));
    const totalGeneral = state.expenses.reduce((s, e) => s + e.amount, 0);
    const balance = fundBalance();

    const summary = h("div", { class: "summary" },
      h("div", { class: "summary-card" }, h("div", { class: "label" }, "Total registrado"), h("div", { class: "value" }, money(totalGeneral))),
      h("div", { class: "summary-card" },
        h("div", { class: "label" }, CoinsIcon(13), " Fondo común"),
        h("div", { class: "value" }, money(balance)),
        h("div", { style: { fontSize: "0.72rem", color: "var(--ink-muted)", marginTop: "0.3rem" } }, "Se actualiza en tiempo real")
      ),
      ...Object.entries(totals).map(([name, val]) => h("div", { class: "summary-card" },
        h("div", { class: "label" }, h("span", { class: "swatch", style: { background: colorFor(name) } }), name),
        h("div", { class: "value" }, money(val)),
        h("div", { class: "bar-track" }, h("div", { class: "bar-fill", style: { width: `${(val / maxTotal) * 100}%`, background: colorFor(name) } }))
      ))
    );

    const scanBlock = h("div", { style: { marginBottom: "1rem" } },
      ocrBtn, ocrInput, ocrStatus, photoPreview
    );

    const form = h("div", { class: "entry-form" },
      h("div", { class: "field grow" }, h("label", {}, "Descripción"), descInput),
      h("div", { class: "field" }, h("label", {}, "Monto"), amountInput),
      h("div", { class: "field" }, h("label", {}, "Categoría"), categorySelect),
      h("div", { class: "field" }, h("label", {}, "Fecha"), dateInput),
      h("div", { class: "field", style: { flexDirection: "row", alignItems: "center", gap: "0.4rem", paddingBottom: "0.4rem" } }, fundCheckbox, h("label", { style: { marginBottom: "0" } }, "Pagar con fondo común")),
      addBtn
    );

    const list = state.expenses.length === 0
      ? h("div", { class: "empty-state" }, "Todavía no cargaron ningún gasto.", h("br"), "Sumá el primero para empezar a llevar la cuenta.")
      : h("div", {}, ...state.expenses.map((e) => h("div", { class: "list-row", style: { "--row-color": colorFor(e.paidBy) } },
          h("div", { class: "row-main" },
            h("div", { class: "row-title" }, e.desc),
            h("div", { class: "row-meta" },
              h("span", {}, e.category), h("span", {}, "·"), h("span", {}, fmtDate(e.date)), h("span", {}, "·"),
              h("span", {}, e.fromFund ? `Fondo común (cargado por ${e.loggedBy || e.paidBy})` : e.paidBy),
              e.fromFund ? h("span", { class: "pill good" }, "Fondo común") : null
            )
          ),
          h("div", { class: "row-amount" }, money(e.amount)),
          e.receiptPhoto ? h("button", { class: "icon-btn", title: "Ver ticket", onClick: () => { state.viewingReceipt = e.receiptPhoto; render(); } }, CameraIcon(15)) : null,
          h("button", { class: "icon-btn", onClick: () => {
            saveList(state.house, "expenses", state.expenses.filter((x) => x.id !== e.id));
            if (e.fromFund && e.fundTxId) saveList(state.house, "fund", state.fund.filter((f) => f.id !== e.fundTxId));
          } }, TrashIcon(15))
        )));

    return h("div", {}, summary, scanBlock, form, list);
  }

    const descInput = h("input", { id: "input-fund-desc", placeholder: "Ej: Aporte mensual", value: "" });

    descInput.addEventListener("input", updateAddBtn);
    amountInput.addEventListener("input", updateAddBtn);

      if (!descInput.value.trim() || !amountInput.value) return;

      h("div", { class: "value", style: { fontSize: "1.9rem" } }, money(balance)),
      h("div", { style: { fontSize: "0.78rem", color: "var(--ink-muted)", marginTop: "0.3rem" } }, "Cualquiera de los dos puede sumar o usar este dinero, y el saldo se sincroniza al instante en ambos celulares.")
    );

    );

      : h("div", {}, ...state.fund.map((f) => h("div", { class: "list-row", style: { "--row-color": colorFor(f.createdBy) } },
          h("div", { class: "row-main" },
            h("div", { class: "row-title" }, f.desc),
            h("div", { class: "row-meta" }, h("span", {}, fmtDate(f.date)), h("span", {}, "·"), h("span", {}, f.createdBy))
          ),
          h("span", { class: "pill " + (f.type === "ingreso" ? "good" : "bad") }, f.type === "ingreso" ? "Ingreso" : "Gasto"),
          h("div", { class: "row-amount", style: { color: f.type === "ingreso" ? "var(--good)" : "var(--bad)" } }, (f.type === "ingreso" ? "+ " : "− ") + money(f.amount)),
          h("button", { class: "icon-btn", onClick: () => saveList(state.house, "fund", state.fund.filter((x) => x.id !== f.id)) }, TrashIcon(15))
        )));

    return h("div", {}, balanceCard, form, list);

  /* ---------- tab: vencimientos ---------- */
  function buildVencimientosTab() {
    const titleInput = h("input", { id: "input-venc-title", placeholder: "Ej: Alquiler", value: "" });
    const amountInput = h("input", { id: "input-venc-amount", type: "number", placeholder: "0", value: "" });
    const dateInput = h("input", { id: "input-venc-date", type: "date", value: todayISO() });
    const categorySelect = h("select", { id: "input-venc-category" }, ...CAT_VENC.map((c) => h("option", {}, c)));
    const recurringCheckbox = h("input", { id: "input-venc-recurring", type: "checkbox", style: { width: "auto" } });
    const addBtn = h("button", { class: "add-btn", disabled: true }, PlusIcon(15), " Agregar");

    const submitVenc = () => {
      if (!titleInput.value.trim() || !dateInput.value) return;
      const titleVal = titleInput.value.trim();
      const amountVal = amountInput.value ? Number(amountInput.value) : null;
      const dateVal = dateInput.value;
      const catVal = categorySelect.value;
      const recurringVal = recurringCheckbox.checked;

      resetFormFields("input-venc-title", "input-venc-amount", "input-venc-recurring");
      titleInput.value = "";
      amountInput.value = "";
      dateInput.value = todayISO();
      categorySelect.selectedIndex = 0;
      recurringCheckbox.checked = false;
      addBtn.disabled = true;

      const entry = { id: uid(), title: titleVal, amount: amountVal, dueDate: dateVal, category: catVal, recurring: recurringVal, paid: false, createdBy: state.me.name };
      saveList(state.house, "dues", [...state.dues, entry].sort((a, b) => a.dueDate.localeCompare(b.dueDate)));
    };

    titleInput.addEventListener("input", () => { addBtn.disabled = !titleInput.value.trim(); });
    titleInput.addEventListener("keydown", (e) => { if (e.key === "Enter") amountInput.focus(); });
    amountInput.addEventListener("keydown", (e) => { if (e.key === "Enter" && !addBtn.disabled) submitVenc(); });
    addBtn.addEventListener("click", submitVenc);

    const togglePaid = (id) => {
      const target = state.dues.find((d) => d.id === id);
      let list = state.dues.map((d) => (d.id === id ? { ...d, paid: !d.paid } : d));
      if (target && !target.paid && target.recurring) {
        const next = new Date(target.dueDate);
        next.setMonth(next.getMonth() + 1);
        list = [...list, { ...target, id: uid(), paid: false, dueDate: next.toISOString().slice(0, 10) }];
      }
      saveList(state.house, "dues", list.sort((a, b) => a.dueDate.localeCompare(b.dueDate)));
    };

    const form = h("div", { class: "entry-form" },
      h("div", { class: "field grow" }, h("label", {}, "Título"), titleInput),
      h("div", { class: "field" }, h("label", {}, "Monto (opcional)"), amountInput),
      h("div", { class: "field" }, h("label", {}, "Vence"), dateInput),
      h("div", { class: "field" }, h("label", {}, "Categoría"), categorySelect),
      h("div", { class: "field", style: { flexDirection: "row", alignItems: "center", gap: "0.4rem", paddingBottom: "0.4rem" } }, recurringCheckbox, h("label", { style: { marginBottom: "0" } }, "Mensual")),
      addBtn
    );

    const sorted = [...state.dues].sort((a, b) => { if (a.paid !== b.paid) return a.paid ? 1 : -1; return a.dueDate.localeCompare(b.dueDate); });

    const list = sorted.length === 0
      ? h("div", { class: "empty-state" }, "No hay vencimientos cargados.", h("br"), "Agregá el alquiler, las expensas o los servicios para no olvidarse de pagarlos.")
      : h("div", {}, ...sorted.map((d) => {
          const status = dueStatus(d);
          return h("div", { class: "list-row", style: { "--row-color": colorFor(d.createdBy) } },
            h("button", { class: "check-btn" + (d.paid ? " checked" : ""), onClick: () => togglePaid(d.id) }, d.paid ? CheckIcon(13) : null),
            h("div", { class: "row-main" },
              h("div", { class: "row-title" + (d.paid ? " strike" : "") }, d.title),
              h("div", { class: "row-meta" }, h("span", {}, d.category), h("span", {}, "·"), h("span", {}, "Vence " + fmtDate(d.dueDate)), d.recurring ? h("span", {}, "· Mensual") : null)
            ),
            h("span", { class: "pill " + status.cls }, status.label),
            d.amount != null ? h("div", { class: "row-amount" }, money(d.amount)) : null,
            h("button", { class: "icon-btn", onClick: () => saveList(state.house, "dues", state.dues.filter((x) => x.id !== d.id)) }, TrashIcon(15))
          );
        }));

    return h("div", {}, form, list);
  }

  /* ---------- tab: tareas ---------- */
  function scheduleLabel(t) {
    if (t.frequency === "diaria") return "Diaria";
    if (t.frequency === "dias") {
      const days = (t.days || []).slice().sort((a, b) => a - b).map((d) => WEEKDAY_ABBR[d]);
      return days.length ? days.join(", ") : "Días específicos";
    }
    return null;
  }
  function timeLabel(t) {
    if (!t.timeStart) return null;
    return t.timeEnd ? `${t.timeStart}–${t.timeEnd}` : t.timeStart;
  }

  function buildTareasTab() {
    const titleInput = h("input", { id: "input-tarea-title", placeholder: "Ej: Sacar la basura", value: "" });
    const assigneeSelect = h("select", { id: "input-tarea-assignee" }, h("option", {}, "Cualquiera"), ...state.members.map((m) => h("option", {}, m.name)));
    const frequencySelect = h("select", { id: "input-tarea-frequency" },
      h("option", { value: "unica" }, "Única vez"),
      h("option", { value: "diaria" }, "Diaria"),
      h("option", { value: "dias" }, "Días específicos")
    );
    const timeStartInput = h("input", { id: "input-tarea-time-start", type: "time", value: "" });
    const timeEndInput = h("input", { id: "input-tarea-time-end", type: "time", value: "" });
    const addBtn = h("button", { class: "add-btn", disabled: true }, PlusIcon(15), " Agregar");

    const dayCheckboxes = WEEKDAY_ABBR.map((abbr, i) => {
      const cb = h("input", { type: "checkbox", id: `input-tarea-day-${i}` });
      const lbl = h("label", { class: "day-pill" }, cb, abbr);
      cb.addEventListener("input", () => { lbl.classList.toggle("checked", cb.checked); updateAddBtn(); });
      return lbl;
    });
    const daysWrap = h("div", { class: "field", id: "tarea-days-wrap", style: { display: "none" } },
      h("label", {}, "Días"),
      h("div", { style: { display: "flex", gap: "0.3rem" } }, ...dayCheckboxes)
    );

    const updateAddBtn = () => {
      const hasTitle = titleInput.value.trim().length > 0;
      const needsDays = frequencySelect.value === "dias";
      const hasDay = !needsDays || dayCheckboxes.some((lbl) => lbl.querySelector("input").checked);
      addBtn.disabled = !(hasTitle && hasDay);
    };
    titleInput.addEventListener("input", updateAddBtn);
    titleInput.addEventListener("keydown", (e) => { if (e.key === "Enter" && !addBtn.disabled) add(); });
    frequencySelect.addEventListener("input", () => {
      daysWrap.style.display = frequencySelect.value === "dias" ? "block" : "none";
      updateAddBtn();
    });

    const add = () => {
      const needsDays = frequencySelect.value === "dias";
      const days = dayCheckboxes.reduce((acc, lbl, i) => (lbl.querySelector("input").checked ? [...acc, i] : acc), []);
      if (!titleInput.value.trim()) return;
      if (needsDays && days.length === 0) return;
      const entry = {
        id: uid(), title: titleInput.value.trim(), assignee: assigneeSelect.value,
        frequency: frequencySelect.value, days: needsDays ? days : [],
        timeStart: timeStartInput.value || null, timeEnd: timeEndInput.value || null,
        done: false, doneDate: null, createdBy: state.me.name,
      };

      const dayIds = WEEKDAY_ABBR.map((_, i) => `input-tarea-day-${i}`);
      resetFormFields("input-tarea-title", "input-tarea-time-start", "input-tarea-time-end", ...dayIds);
      titleInput.value = "";
      assigneeSelect.selectedIndex = 0;
      frequencySelect.selectedIndex = 0;
      timeStartInput.value = "";
      timeEndInput.value = "";
      daysWrap.style.display = "none";
      dayCheckboxes.forEach((lbl) => { const cb = lbl.querySelector("input"); cb.checked = false; lbl.classList.remove("checked"); });
      updateAddBtn();

      saveList(state.house, "tasks", [entry, ...state.tasks]);
      if (entry.timeStart && notifSupported && Notification.permission === "default") requestNotifPermission();
    };
    addBtn.addEventListener("click", add);
    updateAddBtn();

    const toggle = (t) => {
      if (t.frequency === "unica") {
        saveList(state.house, "tasks", state.tasks.map((x) => (x.id === t.id ? { ...x, done: !x.done } : x)));
      } else {
        const nowDone = taskDoneToday(t);
        saveList(state.house, "tasks", state.tasks.map((x) => (x.id === t.id ? { ...x, doneDate: nowDone ? null : todayISO() } : x)));
      }
    };
    const remove = (id) => saveList(state.house, "tasks", state.tasks.filter((t) => t.id !== id));

    const todays = state.tasks.filter((t) => taskAppliesToday(t));
    const pending = todays.filter((t) => !taskDoneToday(t));
    const done = todays.filter((t) => taskDoneToday(t));
    const notToday = state.tasks.filter((t) => t.frequency === "dias" && !taskAppliesToday(t));

    const form = h("div", { class: "entry-form" },
      h("div", { class: "field grow" }, h("label", {}, "Tarea"), titleInput),
      h("div", { class: "field" }, h("label", {}, "Para"), assigneeSelect),
      h("div", { class: "field" }, h("label", {}, "Repetición"), frequencySelect),
      daysWrap,
      h("div", { class: "field" }, h("label", {}, "Desde (opcional)"), timeStartInput),
      h("div", { class: "field" }, h("label", {}, "Hasta (opcional)"), timeEndInput),
      addBtn
    );

    const notifBanner = (!notifSupported || Notification.permission === "granted") ? null :
      h("div", { class: "empty-state", style: { textAlign: "left", display: "flex", alignItems: "center", justifyContent: "space-between", gap: "0.75rem", padding: "0.85rem 1rem", marginBottom: "1rem" } },
        h("div", { style: { display: "flex", alignItems: "center", gap: "0.5rem" } }, BellIcon(16), h("span", {}, Notification.permission === "denied" ? "Bloqueaste las notificaciones del navegador para este sitio; activalas desde el ícono del candado si querés recordatorios." : "Activá las notificaciones para recibir un aviso al empezar cada actividad.")),
        Notification.permission === "denied" ? null : h("button", { class: "add-btn", onClick: () => requestNotifPermission() }, "Activar")
      );

    const rowMeta = (t) => [
      h("span", {}, t.assignee),
      scheduleLabel(t) ? h("span", { style: { display: "inline-flex", alignItems: "center", gap: "0.2rem" } }, "·", RepeatIcon(11), scheduleLabel(t)) : null,
      timeLabel(t) ? h("span", { style: { display: "inline-flex", alignItems: "center", gap: "0.2rem" } }, "·", BellIcon(11), timeLabel(t)) : null,
    ];

    const taskRow = (t, checked) => h("div", { class: "list-row" + (checked ? " done" : ""), style: { "--row-color": colorFor(t.createdBy) } },
      h("button", { class: "check-btn" + (checked ? " checked" : ""), onClick: () => toggle(t) }, checked ? CheckIcon(13) : null),
      h("div", { class: "row-main" }, h("div", { class: "row-title" + (checked ? " strike" : "") }, t.title), h("div", { class: "row-meta" }, ...rowMeta(t))),
      h("button", { class: "icon-btn", onClick: () => remove(t.id) }, TrashIcon(15))
    );

    let listBody;
    if (state.tasks.length === 0) {
      listBody = h("div", { class: "empty-state" }, "La lista de tareas está vacía.", h("br"), "Anoten lo que hay que hacer en casa esta semana.");
    } else {
      listBody = h("div", {},
        pending.length === 0 && done.length === 0 ? h("div", { class: "empty-state" }, "Nada para hoy en la lista de tareas.") : null,
        ...pending.map((t) => taskRow(t, false)),
        done.length > 0 ? h("div", { style: { marginTop: "1.25rem", fontSize: "0.78rem", color: "var(--ink-muted)", marginBottom: "0.5rem" } }, "Hechas hoy") : null,
        ...done.map((t) => taskRow(t, true)),
        notToday.length > 0 ? h("div", { style: { marginTop: "1.5rem", fontSize: "0.78rem", color: "var(--ink-muted)", marginBottom: "0.5rem" } }, "Programadas para otros días") : null,
        ...notToday.map((t) => h("div", { class: "list-row", style: { "--row-color": colorFor(t.createdBy), opacity: "0.65" } },
          h("div", { class: "row-main" }, h("div", { class: "row-title" }, t.title), h("div", { class: "row-meta" }, ...rowMeta(t))),

  /* --- Sub-pestaña: Indeciso (Ruleta) --- */
  function buildIndecisoSubTab() {
    const opts = state.rouletteOptions || ["Cena en casa", "Salir a comer", "Paseo y helado", "Noche de pelis"];
    
    // Plantillas rápidas
    const presets = [
      { label: "🍕 ¿Qué comemos?", items: ["Pizza casera", "Sushi", "Hamburguesas", "Cocinar en casa", "Empanadas"] },
      { label: "🎬 ¿Qué vemos?", items: ["Comedia", "Terror o misterio", "Serie pendiente", "Documental", "Elegir al azar"] },
      { label: "🌆 Planes de finde", items: ["Paseo y heladería", "Bar o café nuevo", "Picnic al parque", "Cine", "Quedarse en la cama"] }
    ];

    const presetRow = h("div", { style: { display: "flex", gap: "0.4rem", flexWrap: "wrap", marginBottom: "1rem" } },
      ...presets.map((p) => h("button", {
        class: "subtab-btn",
        style: { fontSize: "0.78rem", padding: "0.3rem 0.65rem" },
        disabled: state.isSpinning,
        onClick: () => {
          if (state.isSpinning) return;
          state.rouletteOptions = [...p.items];
          state.rouletteWinner = null;
          render();
        }
      }, p.label)),
      (state.datesPlans && state.datesPlans.length >= 2) ? h("button", {
        class: "subtab-btn",
        style: { fontSize: "0.78rem", padding: "0.3rem 0.65rem", background: "var(--surface-muted)" },
        disabled: state.isSpinning,
        onClick: () => {
          if (state.isSpinning) return;
          const shuffled = [...state.datesPlans].sort(() => 0.5 - Math.random());
          state.rouletteOptions = shuffled.slice(0, Math.min(5, shuffled.length)).map((p) => p.title);
          state.rouletteWinner = null;
          render();
        }
      }, "💡 Cargar de 'Sin ideas'") : null
    );

    // Controles de opciones (entre 2 y 6)
    const newOptInput = h("input", { id: "input-new-option", placeholder: "Agregar opción (ej: Paseo al río)…", style: { flex: "1" }, disabled: state.isSpinning });
    const addOptBtn = h("button", { class: "add-btn", disabled: opts.length >= 6 || state.isSpinning }, PlusIcon(14), " Sumar");
    
    const addOption = () => {
      if (state.isSpinning) return;
      const val = newOptInput.value.trim();
      if (!val || opts.length >= 6) return;
      resetFormFields("input-new-option");
      newOptInput.value = "";
      state.rouletteOptions = [...opts, val];
      state.rouletteWinner = null;
      render();
    };
    addOptBtn.addEventListener("click", addOption);
    newOptInput.addEventListener("keydown", (e) => { if (e.key === "Enter") addOption(); });

    const optionsList = h("div", { style: { display: "flex", flexWrap: "wrap", gap: "0.4rem", margin: "0.6rem 0 1rem" } },
      ...opts.map((opt, i) => {
        const color = PALETTE[i % PALETTE.length];
        return h("div", {
          style: {
            display: "inline-flex", alignItems: "center", gap: "0.4rem",
            background: "var(--surface)", border: "1px solid var(--line)",
            borderLeft: `4px solid ${color}`, borderRadius: "8px", padding: "0.35rem 0.65rem",
            fontSize: "0.85rem", color: "var(--ink)"
          }
        },
          h("span", {}, opt),
          opts.length > 2 ? h("button", {
            class: "icon-btn",
            style: { padding: "0.1rem" },
            disabled: state.isSpinning,
            onClick: () => {
              if (state.isSpinning) return;
              state.rouletteOptions = opts.filter((_, idx) => idx !== i);
              state.rouletteWinner = null;
              render();
            }
          }, XIcon(12)) : null
        );
      })
    );

    // Canvas de la ruleta (resolución Retina 580x580 para nitidez máxima en 290x290)
    const canvas = h("canvas", {
      id: "roulette-canvas",
      width: "580",
      height: "580",
      style: { width: "290px", height: "290px", borderRadius: "50%", display: "block" }
    });
    const needle = h("div", { class: "needle" });
    const spinBtn = h("button", {
      id: "roulette-spin-btn",
      class: "primary-btn roulette-spin-btn",
      disabled: state.isSpinning
    }, state.isSpinning ? "…" : "GIRAR");

    // Función inteligente de ajuste de texto: adapta tamaño y trunca elegantemente para evitar
    // que cualquier letra sea tapada por el botón central o sobresalga del borde exterior.
    const fitWheelText = (ctx, text, maxWidth) => {
      ctx.font = "bold 12px 'Inter', -apple-system, sans-serif";
      if (ctx.measureText(text).width <= maxWidth) return { text, font: ctx.font };
      ctx.font = "bold 11px 'Inter', -apple-system, sans-serif";
      if (ctx.measureText(text).width <= maxWidth) return { text, font: ctx.font };
      ctx.font = "bold 10px 'Inter', -apple-system, sans-serif";
      if (ctx.measureText(text).width <= maxWidth) return { text, font: ctx.font };
      let t = text;
      while (t.length > 2 && ctx.measureText(t + "…").width > maxWidth) {
        t = t.slice(0, -1);
      }
      return { text: t.trim() + "…", font: ctx.font };
    };

    const numOpts = opts.length;
    const arc = (2 * Math.PI) / numOpts;

    const drawWheel = () => {
      const activeCanvas = document.getElementById("roulette-canvas") || canvas;
      if (!activeCanvas) return;
      const ctx = activeCanvas.getContext("2d");
      if (!ctx) return;

      ctx.save();
      // Escala 2x para nitidez HD en móviles y pantallas de alta densidad
      ctx.scale(2, 2);
      const width = 290;
      const height = 290;
      const radius = 145;

      ctx.clearRect(0, 0, width, height);

      // Dibujar sectores
      for (let i = 0; i < numOpts; i++) {
        const angle = rouletteAngle + i * arc;
        ctx.beginPath();
        ctx.fillStyle = PALETTE[i % PALETTE.length];
        ctx.moveTo(radius, radius);
        ctx.arc(radius, radius, radius - 4, angle, angle + arc, false);
        ctx.lineTo(radius, radius);
        ctx.fill();
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = "#FFFFFF";
        ctx.stroke();

        // Texto de cada opción
        // El botón central tiene radio 27px (diámetro 54px) + borde.
        // La zona radial segura va de r=42px hasta r=132px.
        // El punto medio radial es r=88px con ancho máximo de 82px.
        // El texto centrado en r=88px se extiende como máximo entre 47px y 129px,
        // quedando con más de 17px de margen de separación del botón central.
        const maxTextWidth = 82;
        const { text: labelToDraw, font } = fitWheelText(ctx, opts[i], maxTextWidth);

        ctx.save();
        ctx.translate(radius, radius);
        ctx.rotate(angle + arc / 2);
        ctx.font = font;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#FFFFFF";
        ctx.shadowColor = "rgba(0,0,0,0.55)";
        ctx.shadowBlur = 4;
        ctx.fillText(labelToDraw, 88, 0);
        ctx.restore();
      }

      // Aro exterior decorativo elegante
      ctx.beginPath();
      ctx.arc(radius, radius, radius - 3, 0, 2 * Math.PI);
      ctx.lineWidth = 3;
      ctx.strokeStyle = "rgba(255,255,255,0.85)";
      ctx.stroke();

      // Círculo base blanco bajo el botón central para terminación limpia
      ctx.beginPath();
      ctx.arc(radius, radius, 30, 0, 2 * Math.PI);
      ctx.fillStyle = "#FFFFFF";
      ctx.fill();

      ctx.restore();
    };

    // Función matemática para identificar qué sector queda bajo la aguja superior (3*PI/2)
    const getSliceAtNeedle = (angle, count) => {
      const sliceArc = (2 * Math.PI) / count;
      const norm = ((3 * Math.PI / 2 - (angle % (2 * Math.PI))) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
      return Math.floor(norm / sliceArc) % count;
    };

    // Girar la ruleta con física fluida, aceleración inicial y desaceleración natural
    const spin = () => {
      if (state.isSpinning || opts.length < 2) return;
      state.isSpinning = true;
      state.rouletteWinner = null;

      // Actualizar UI inmediatamente sin recrear el DOM completo
      const activeBtn = document.getElementById("roulette-spin-btn") || spinBtn;
      if (activeBtn) {
        activeBtn.disabled = true;
        activeBtn.textContent = "…";
        activeBtn.style.opacity = "0.75";
      }

      const winnerContainer = document.getElementById("roulette-winner-container");
      if (winnerContainer) winnerContainer.innerHTML = "";

      // Reactivar contexto de audio si estaba suspendido
      try {
        const aCtx = getAudioCtx();
        if (aCtx && aCtx.state === "suspended") aCtx.resume();
      } catch (e) {}

      // Mínimo 6 vueltas completas + entre 0 y 2 vueltas adicionales + aterrizaje aleatorio
      const fullRotations = 6 + Math.floor(Math.random() * 3);
      const randomOffset = Math.random() * (2 * Math.PI);
      const totalDelta = fullRotations * (2 * Math.PI) + randomOffset;

      const startAngle = rouletteAngle;
      const targetAngle = startAngle + totalDelta;
      const duration = 3800; // 3.8s de giro fluido y entretenido
      const startTime = performance.now();

      let lastSliceIndex = getSliceAtNeedle(startAngle, numOpts);
      let lastTickTime = 0;

      // Curva de desaceleración cuártica: arranca con potencia y desacelera suavemente
      const easeOutQuart = (x) => 1 - Math.pow(1 - x, 4);

      const step = (now) => {
        if (!state.isSpinning) return;

        const elapsed = now - startTime;
        const progress = Math.min(1, elapsed / duration);
        const eased = easeOutQuart(progress);

        rouletteAngle = startAngle + totalDelta * eased;

        // Sonido de tick cada vez que un sector cruza la aguja superior
        const currentSlice = getSliceAtNeedle(rouletteAngle, numOpts);
        if (currentSlice !== lastSliceIndex) {
          const nowMs = performance.now();
          if (nowMs - lastTickTime > 40) {
            playTick();
            lastTickTime = nowMs;
          }
          lastSliceIndex = currentSlice;
        }

        drawWheel();

        if (progress < 1) {
          animFrameId = requestAnimationFrame(step);
        } else {
          // Detención final perfecta
          animFrameId = null;
          state.isSpinning = false;
          rouletteAngle = targetAngle % (2 * Math.PI);
          drawWheel();

          const winnerIndex = getSliceAtNeedle(rouletteAngle, numOpts);
          const winner = opts[winnerIndex] || opts[0];
          state.rouletteWinner = winner;

          playFanfare();
          if (window.confetti) {
            try {
              window.confetti({ particleCount: 75, spread: 65, origin: { y: 0.6 } });
            } catch (e) {}
          }
          render();
        }
      };

      animFrameId = requestAnimationFrame(step);
    };

    spinBtn.addEventListener("click", spin);

    // Dibujar en el próximo ciclo
    setTimeout(drawWheel, 10);

    const canvasWrapper = h("div", { class: "canvas-wrapper" }, needle, canvas, spinBtn);

    // Banner de resultado cuando hay un ganador
    let winnerSection = null;
    if (state.rouletteWinner) {
      const winner = state.rouletteWinner;
      winnerSection = h("div", { class: "winner-banner" },
        h("div", { style: { fontSize: "0.8rem", color: "var(--ink-muted)", textTransform: "uppercase", letterSpacing: "1px", fontWeight: "700" } }, "🎉 ¡El plan elegido es!"),
        h("div", { class: "winner-title" }, `"${winner}"`),
        h("div", { class: "winner-actions" },
          h("button", {
            class: "primary-btn",
            style: { fontSize: "0.82rem", padding: "0.45rem 0.85rem", display: "inline-flex", alignItems: "center", gap: "0.35rem" },
            onClick: () => {
              sendHouseAlert("roulette", `🎲 ¡Giré la ruleta en Citas y Planes y salió: "${winner}"!`);
              alert(`¡Aviso enviado a tu pareja! ("${winner}")`);
            }
          }, BellIcon(14), " Avisar a mi pareja"),
          h("button", {
            class: "subtab-btn",
            style: { background: "var(--surface)", color: "var(--ink)", borderColor: "var(--line)" },
            onClick: () => {
              saveList(state.house, "events", [...state.events, { id: uid(), title: `Cita: ${winner}`, date: todayISO(), createdBy: state.me.name }]);
              alert(`Agendado en el Calendario para hoy.`);
            }
          }, CalendarIcon(14), " Agendar en Calendario"),
          h("button", {
            class: "ghost-btn",
            style: { padding: "0.45rem 0.75rem", fontSize: "0.82rem" },
            onClick: () => { state.rouletteWinner = null; spin(); }
          }, RepeatIcon(14), " Girar de nuevo")
        )
      );
    }
    const winnerContainer = h("div", { id: "roulette-winner-container", style: { width: "100%", display: "flex", justifyContent: "center" } }, winnerSection);

    return h("div", { class: "roulette-container" },
      h("div", { style: { width: "100%", maxWidth: "440px" } },
        h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "0.4rem" } },
          h("h3", { style: { fontFamily: "Fraunces, serif", fontSize: "1.1rem" } }, "Ruleta de decisión rápida"),
          h("span", { style: { fontSize: "0.76rem", color: "var(--ink-muted)" } }, `${opts.length} de 6 opciones`)
        ),
        h("p", { style: { fontSize: "0.82rem", color: "var(--ink-muted)", margin: "0 0 0.75rem" } },
          "Ingresen entre 2 y 6 alternativas. La ruleta decide por ustedes sin vueltas:"
        ),
        presetRow,
        optionsList,
        opts.length < 6 ? h("div", { style: { display: "flex", gap: "0.4rem", marginBottom: "1rem" } }, newOptInput, addOptBtn) : null
      ),
      canvasWrapper,
      winnerContainer
    );
  }

      descInput.value = "";

      addBtn.disabled = true;

      const newPlan = {
        id: uid(),
